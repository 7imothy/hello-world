<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Utila Vacation">
    <meta name="theme-color" content="#007AFF">
    <title>Utila Vacation Guide</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main App Container -->
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <h1 id="page-title">Restaurants</h1>
        </header>

        <!-- Content Area -->
        <main id="content" class="content">
            <!-- Content will be dynamically loaded here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="restaurants">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2M7 2v20M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3z"/>
                </svg>
                <span>Restaurants</span>
            </button>
            <button class="nav-btn" data-page="activities">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M7.5 4.5l1.5 1.5M6 10h2M8 13l-1.5 1.5M10.5 2.5L9 4M15 9h2M13 12l1.5 1.5M18.5 4.5L17 6"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 19v2M5 12H3M19 12h2M12 5V3"/>
                </svg>
                <span>Activities</span>
            </button>
            <button class="nav-btn" data-page="weather">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    <circle cx="12" cy="12" r="5"/>
                </svg>
                <span>Weather</span>
            </button>
            <button class="nav-btn" data-page="diving">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 6v6l4 2"/>
                </svg>
                <span>Diving</span>
            </button>
            <button class="nav-btn" data-page="tips">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18h6M10 22h4M15 2a7 7 0 00-4 13v3h6v-3a7 7 0 00-4-13z"/>
                </svg>
                <span>Tips</span>
            </button>
        </nav>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="close-modal">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
